<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>波形叠影台 · 示波器分段、触发抖动与测量窗口谱系</title>
<style>
:root{--bg:#101418;--panel:#1a2027;--line:#2c3641;--fg:#d7e0e8;--dim:#8494a3;--acc:#4fc3f7;--ok:#7bd88f;--bad:#ff7a90;--warn:#ffd479}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 "SF Mono",Menlo,monospace}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:15px;margin:0;color:var(--acc)}
button,select{background:#232c36;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
.badge{border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--dim)}
main{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.panel h2{font-size:12px;margin:0 0 6px;color:var(--dim);font-weight:normal}
.wide{grid-column:1/3}
svg{width:100%;height:220px;background:#0c0f12;border-radius:4px}
.list{max-height:200px;overflow:auto}
.row{padding:3px 6px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.id{color:var(--acc)}
.dim{color:var(--dim)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tag{border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:11px}
#conflict{position:fixed;inset:10%;background:var(--panel);border:1px solid var(--bad);border-radius:8px;padding:16px;display:none;overflow:auto;z-index:9}
#conflict pre{background:#0c0f12;padding:8px;border-radius:4px;overflow:auto}
#toast{position:fixed;bottom:12px;right:12px;background:var(--panel);border:1px solid var(--acc);border-radius:6px;padding:8px 12px;display:none}
</style>
</head>
<body>
<header>
<h1>波形叠影台</h1>
<span class="dim">示波器分段 · 触发抖动 · 测量窗口谱系</span>
<button id="btn-load">载入仓库示例</button>
<button id="btn-step">推进剧本</button>
<select id="branch"></select>
<span class="badge" id="v-rule"></span><span class="badge" id="v-params"></span><span class="badge" id="v-interval"></span>
<button id="btn-export">导出档案</button>
<button id="btn-reimport">删库重导</button>
</header>
<main>
<section class="panel wide"><h2>叠影（事件对齐，单位 s / V，参考段 seg:ch1/0000）</h2><svg id="overlay"></svg></section>
<section class="panel"><h2>抖动分布（单位 s）</h2><svg id="jitter"></svg><div id="jitter-stats" class="dim"></div></section>
<section class="panel"><h2>测量窗与测量值（每个值带稳定身份）</h2><div id="meas" class="list"></div></section>
<section class="panel"><h2>触发/对齐候选（接受或否定只追加事件）</h2><div id="cands" class="list"></div></section>
<section class="panel"><h2>被排除段与原因</h2><div id="excluded" class="list"></div>
<h2>规则判定事件（机器可读）</h2><div id="rules" class="list"></div></section>
<section class="panel wide"><h2>事件历史（回到任意旧事件可恢复当时版本与结论；裁定可撤销）</h2><div id="events" class="list"></div></section>
</main>
<div id="conflict"></div>
<div id="toast"></div>
<script>
let branch = null, headSeq = 0, lastView = null, atSeq = null;
const $ = id => document.getElementById(id);
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (r.status === 409 && body.error === 'version-conflict') { showConflict(body); throw body; }
  if (!r.ok) { toast(body.error || r.statusText); throw body; }
  return body;
};
const post = (path, body) => api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
const toast = msg => { const t=$('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 3500); };
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, text) => { const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(text!=null)e.textContent=text; return e; };
const fmt = (v,u) => v==null?'—':(Math.abs(v)<1e-3?(v*1e9).toFixed(3)+' n'+u:(v).toPrecision(4)+' '+u);

async function refreshStatus() {
  const s = await api('/api/status');
  const sel = $('branch');
  const prev = branch;
  sel.innerHTML = '';
  for (const b of s.branches) {
    const o = document.createElement('option');
    o.value = b.id; o.textContent = `${b.id} (${b.name}) head=${b.head_seq}`;
    sel.appendChild(o);
  }
  branch = prev && s.branches.some(b=>b.id===prev) ? prev : (s.branches[0] && s.branches[0].id);
  if (branch) sel.value = branch;
  return s;
}

async function refreshView() {
  if (!branch) return;
  const q = atSeq!=null ? `?seq=${atSeq}` : '';
  const v = await api(`/api/branches/${branch}/view${q}`);
  lastView = v; headSeq = v.head_seq;
  $('v-rule').textContent = v.versions.rule_version;
  $('v-params').textContent = v.versions.params_version;
  $('v-interval').textContent = v.versions.interval_version || '—';
  drawOverlay(v); drawJitter(v); renderMeas(v); renderCands(v);
  renderExcluded(v); renderRules(v); renderEvents(v);
}

function scale(vals, lo, hi, pixels, pad) {
  const span = (hi-lo)||1;
  return x => pad + (x-lo)/span*(pixels-2*pad);
}

function drawOverlay(v) {
  const svg = $('overlay'); svg.innerHTML='';
  const W=900,H=220; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const ts=[], vs=[];
  for (const s of v.segments) if (s.t) { ts.push(...s.t); vs.push(...s.v); }
  if (!ts.length) return;
  const x = scale(0, Math.min(...ts), Math.max(...ts), W, 30);
  const y = scale(0, Math.min(...vs), Math.max(...vs), H, 12);
  for (const w of v.windows) {
    svg.appendChild(el('rect',{x:x(w.t0),y:6,width:Math.max(1,x(w.t1)-x(w.t0)),height:H-12,fill:'#4fc3f722'}));
    svg.appendChild(el('text',{x:x(w.t0)+3,y:16,fill:'#8494a3','font-size':10},w.id));
  }
  const colors=['#4fc3f7','#7bd88f','#ffd479','#ff7a90','#c792ea','#89ddff','#f78c6c','#a5d6a7','#e6ee9c','#90a4ae'];
  v.segments.forEach((s,i)=>{
    if (!s.t) return;
    let d='',pen=false;
    s.t.forEach((t,j)=>{ if(!s.valid[j]){pen=false;return;}
      d += (pen?'L':'M')+x(t).toFixed(1)+' '+y(s.v[j]).toFixed(1)+' '; pen=true; });
    svg.appendChild(el('path',{d,fill:'none',stroke:s.excluded?'#555':colors[i%10],
      'stroke-width':1,'stroke-dasharray':s.excluded?'3 3':'none'}));
  });
  svg.appendChild(el('text',{x:4,y:H-6,fill:'#8494a3','font-size':10},
    `参考事件 t=${fmt(v.ref_event,'s')} · 虚线=被排除段 · 阴影=测量窗`));
}

function drawJitter(v) {
  const svg=$('jitter'); svg.innerHTML='';
  const W=440,H=220; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const vals=Object.entries(v.jitter).filter(([id])=>!v.excluded.some(e=>e.segment===id));
  if(!vals.length) return;
  const js=vals.map(([,x])=>x), lo=Math.min(...js), hi=Math.max(...js);
  const x=scale(0,lo-(hi-lo)*.1||-1e-9,hi+(hi-lo)*.1||1e-9,W,40);
  svg.appendChild(el('line',{x1:30,y1:H-20,x2:W-10,y2:H-20,stroke:'#2c3641'}));
  vals.forEach(([id,val],i)=>{
    svg.appendChild(el('circle',{cx:x(val),cy:H-30-(i%5)*12,r:4,fill:'#4fc3f7'}));
    svg.appendChild(el('text',{x:x(val)+6,y:H-27-(i%5)*12,fill:'#8494a3','font-size':9},id));
  });
  const st=v.jitter_stats;
  $('jitter-stats').textContent = st.count!=null ?
    `n=${st.count} mean=${fmt(st.mean,'s')} std=${fmt(st.std,'s')} min=${fmt(st.min,'s')} max=${fmt(st.max,'s')}` : '';
}

function renderMeas(v) {
  const d=$('meas'); d.innerHTML='';
  for (const [seg, per] of Object.entries(v.measurements))
    for (const [win, m] of Object.entries(per)) {
      const r=document.createElement('div'); r.className='row';
      r.innerHTML = `<span class="id">${m.id}</span>`+
        (m.status==='empty' ? `<span class="warn">empty</span>` :
        `<span>mean=${(m.mean*1e3).toFixed(2)}mV min=${(m.min*1e3).toFixed(2)} max=${(m.max*1e3).toFixed(2)} n=${m.count}</span>`)+
        (m.excluded_samples?`<span class="warn">排除样本 ${m.excluded_samples}</span>`:'')+
        `<span class="tag">${m.status}</span>`;
      d.appendChild(r);
    }
}

function renderCands(v) {
  const d=$('cands'); d.innerHTML='';
  for (const s of v.segments) for (const c of (s.candidates||[])) {
    if (!c.id) continue;
    const cur = v.state.rulings[c.id];
    const sel = s.selected && s.selected.rank===c.rank;
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="id">${c.id}</span><span>τ=${fmt(c.tau,'s')} score=${c.score.toFixed(3)}</span>`+
      (sel?'<span class="tag ok">当前</span>':'')+(cur?`<span class="tag">${cur}</span>`:'');
    const mk=(txt,dec)=>{const b=document.createElement('button');b.textContent=txt;
      b.onclick=()=>ruling(c.id,dec);b.style.marginLeft='4px';return b;};
    r.appendChild(mk('接受','accept')); r.appendChild(mk('否定','reject'));
    d.appendChild(r);
  }
}

function renderExcluded(v) {
  const d=$('excluded'); d.innerHTML='';
  for (const e of v.excluded) for (const rsn of e.reasons) {
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="id">${e.segment}</span><span class="bad">${rsn.rule}</span><span class="dim">${rsn.detail}</span>`;
    d.appendChild(r);
  }
  if(!v.excluded.length) d.innerHTML='<div class="row dim">无</div>';
}

function renderRules(v) {
  const d=$('rules'); d.innerHTML='';
  for (const e of v.rule_events) {
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="tag warn">${e.rule}</span><span class="id">${e.segment||''}</span><span class="dim">${e.detail}</span>`;
    d.appendChild(r);
  }
}

function renderEvents(v) {
  const d=$('events'); d.innerHTML='';
  for (const e of [...v.state.events].reverse()) {
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="id">${e.id}</span><span class="tag">${e.kind}</span>`+
      `<span class="dim">${JSON.stringify(e.payload).slice(0,120)}</span>`+
      (e.undone?'<span class="bad">已撤销</span>':'');
    if (e.kind==='ruling' && !e.undone) {
      const b=document.createElement('button'); b.textContent='撤销';
      b.onclick=()=>undoEvt(e.id); r.appendChild(b);
    }
    const g=document.createElement('button'); g.textContent='回到此事件';
    g.onclick=()=>{atSeq=e.seq; refreshView();};
    r.appendChild(g);
    d.appendChild(r);
  }
  if (atSeq!=null) {
    const b=document.createElement('button'); b.textContent=`返回最新（当前停在 seq=${atSeq}）`;
    b.onclick=()=>{atSeq=null; refreshView();}; d.prepend(b);
  }
}

async function ruling(target, decision) {
  await post(`/api/branches/${branch}/events`,
    {kind:'ruling', payload:{target, decision}, base_seq: headSeq});
  toast(`裁定已记录：${target} -> ${decision}`); await refreshStatus(); await refreshView();
}
async function undoEvt(eventId) {
  await post(`/api/branches/${branch}/undo`, {event_id: eventId, base_seq: headSeq});
  toast(`已撤销 ${eventId}，恢复前一分支状态`); await refreshStatus(); await refreshView();
}

function showConflict(c) {
  const d=$('conflict');
  d.innerHTML=`<h2 class="bad">版本冲突：base=${c.base_seq}，当前 head=${c.head_seq}</h2>
    <p class="dim">对方已提交的事件与你的修改同时发生，双方差异如下；原数据未被改写。</p>
    <h3>对方事件</h3><pre>${JSON.stringify(c.their_events,null,1)}</pre>
    <h3>你的提交（未采纳）</h3><pre>${JSON.stringify(c.your_event,null,1)}</pre>
    <button onclick="document.getElementById('conflict').style.display='none'">关闭</button>`;
  d.style.display='block';
}

$('btn-load').onclick = async () => {
  try { const r = await post('/api/cases/load'); toast(`已载入 ${r.case_id}：${r.sources} 个来源`); }
  catch(e) {}
  await refreshStatus(); await refreshView();
};
$('btn-step').onclick = async () => {
  const r = await post('/api/scenario/step');
  toast(r.done ? '剧本已走完' : `步骤 ${r.step}：${r.title}`);
  await refreshStatus(); await refreshView();
};
$('branch').onchange = e => { branch=e.target.value; atSeq=null; refreshView(); };
$('btn-export').onclick = async () => {
  const a = await api('/api/export');
  const blob = new Blob([JSON.stringify(a)], {type:'application/json'});
  const u = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href=u; link.download='waveforge-export.json'; link.click();
  window._lastExport = a; toast('档案已导出（含全部身份/顺序/来源关系）');
};
$('btn-reimport').onclick = async () => {
  const a = window._lastExport || await api('/api/export');
  await post('/api/import', a);
  toast('本地库已删除并按档案重建，身份与顺序保持'); await refreshStatus(); await refreshView();
};
refreshStatus().then(refreshView);
</script>
</body>
</html>
